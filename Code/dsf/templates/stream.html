{% extends "base.html" %}
{% block title %}{{ nickname }} - Camera Stream{% endblock %}

{% block page %}{% raw %}
<v-app>
	<v-main>
		<v-container class="d-flex flex-column align-center ga-4 py-6">
			<h1 class="text-headline-medium">{{ nickname }}</h1>
			<v-card class="w-100" max-width="960">
				<div class="pg-media">
					<img v-if="streamUrl" :src="streamUrl" @error="onStreamError" :alt="'Live stream for ' + nickname" />
				</div>
			</v-card>
		</v-container>
	</v-main>
</v-app>
{% endraw %}{% endblock %}

{% block scripts %}
<script>
	// HTTP cameras are shown directly from the camera, at its own frame rate. RTSP cameras (which
	// browsers cannot play), or a direct stream that fails, are shown through the plugin instead.
	// The stream is closed while the tab is hidden (see PG.visibility in common.js).
	const DIRECT_URL = {{ direct_url | tojson }};
	const PLUGIN_URL = '/camera/stream/' + encodeURIComponent({{ camera_uuid | tojson }});
	PG.mount({
		setup() {
			const useDirect = Vue.ref(Boolean(DIRECT_URL));
			const streamUrl = Vue.computed(() => PG.visibility.visible ? (useDirect.value ? DIRECT_URL : PLUGIN_URL) : '');
			const onStreamError = () => {
				if (useDirect.value) {
					console.warn('Direct camera stream failed - using the plugin stream instead');
					useDirect.value = false;
				}
			};
			return { nickname: {{ nickname | tojson }}, streamUrl, onStreamError };
		}
	});
</script>
{% endblock %}
