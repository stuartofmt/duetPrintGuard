name: Release

# Builds the installable plugin ZIP against DuetWebControl's source and creates a GitHub Release for
# it - no local build needed. Just push a version tag:
#
#   (bump the plugin manifest + package.json, commit) then:
#   git tag v1.2.3 && git push origin v1.2.3
#
# This runs automatically, builds duetPrintGuard-<version>.zip against DWC, and publishes a Release
# for the tag with the ZIP attached. Title (from scripts/release-titles.txt) and notes
# (Conventional-Commit changelog) are both generated - no manual step.
#
# You can also run it manually (Actions -> Release -> Run workflow) to build a ZIP as an artifact.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dwc-ref:
        description: Optional compatible DuetWebControl tag override; blank selects the highest compatible release
        required: false
        type: string
        default: ""

permissions:
  contents: write # create the Release and upload the asset

env:
  # The Conventional-Commit changelog generator is shared across the Duet plugin family and lives in
  # the runtime repo (single source of truth). Pinned to a ref; bump this one line to adopt changelog
  # format changes. Source: jaysuk/dwc-plugin-runtime → scripts/changelog.mjs.
  RUNTIME_REF: d077f81a11bb5af9a35fe39f7b82d789eab19896

jobs:
  resolve-dwc:
    runs-on: ubuntu-latest
    outputs:
      manifest: ${{ steps.resolve.outputs.manifest }}
      dwc-ref: ${{ steps.resolve.outputs.dwc-ref }}
      plugin-version: ${{ steps.resolve.outputs.plugin-version }}
      release-exists: ${{ steps.resolve.outputs.release-exists }}
      release-url: ${{ steps.resolve.outputs.release-url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with: { node-version: 24 }

      - name: Resolve plugin manifest and compatible DuetWebControl release
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DWC_REF_OVERRIDE: ${{ inputs.dwc-ref }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync, readdirSync } from "node:fs";
          import { join, relative } from "node:path";

          function findManifests(directory) {
            const matches = [];
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              if (entry.isDirectory() && ![".git", "node_modules", "venv"].includes(entry.name)) {
                matches.push(...findManifests(join(directory, entry.name)));
              } else if (entry.isFile() && entry.name === "plugin.json") {
                matches.push(join(directory, entry.name));
              }
            }
            return matches;
          }

          const manifestPath = existsSync("plugin.json")
            ? "plugin.json"
            : (() => {
                const matches = findManifests(".");
                if (matches.length === 0) throw new Error("No plugin.json found at the repository root or in subfolders.");
                if (matches.length > 1) throw new Error(`Multiple subfolder plugin.json files found: ${matches.map((path) => relative(".", path)).join(", ")}`);
                return relative(".", matches[0]);
              })();
          const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
          if (typeof manifest.version !== "string" || !manifest.version) {
            throw new Error(`${manifestPath} must contain a non-empty string version.`);
          }
          if (typeof manifest.dwcVersion !== "string" || !manifest.dwcVersion) {
            throw new Error(`${manifestPath} must contain a non-empty string dwcVersion.`);
          }

          const tag = process.env.GITHUB_REF.startsWith("refs/tags/")
            ? process.env.GITHUB_REF.slice("refs/tags/".length)
            : "";
          if (tag && tag.replace(/^v/, "") !== manifest.version) {
            throw new Error(`Release tag "${tag}" does not match ${manifestPath} version "${manifest.version}".`);
          }

          let existingRelease = null;
          if (tag) {
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases/tags/${encodeURIComponent(tag)}`, {
              headers: {
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
                ...(process.env.GITHUB_TOKEN ? { Authorization: `Bearer ${process.env.GITHUB_TOKEN}` } : {}),
              },
            });
            if (response.status === 404) {
              console.log(`No published GitHub Release exists for ${tag}.`);
            } else if (!response.ok) {
              throw new Error(`GitHub Release lookup for ${tag} returned ${response.status}: ${await response.text()}`);
            } else {
              existingRelease = await response.json();
              console.log(`A published GitHub Release already exists for ${tag}: ${existingRelease.html_url}`);
            }
          }

          function parseVersion(value) {
            const match = /^v?(0|[1-9]\d*)\.(0|[1-9]\d*)(?:\.(0|[1-9]\d*))?(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.exec(value);
            if (!match) return null;
            return {
              major: Number(match[1]),
              minor: Number(match[2]),
              patch: Number(match[3] ?? 0),
              patchSpecified: match[3] !== undefined,
              prerelease: match[4]?.split(".") ?? [],
            };
          }

          function compareVersions(a, b) {
            for (const key of ["major", "minor", "patch"]) {
              if (a[key] !== b[key]) return a[key] - b[key];
            }
            if (a.prerelease.length === 0 || b.prerelease.length === 0) {
              return a.prerelease.length === b.prerelease.length ? 0 : a.prerelease.length === 0 ? 1 : -1;
            }
            for (let i = 0; i < Math.max(a.prerelease.length, b.prerelease.length); i++) {
              const x = a.prerelease[i], y = b.prerelease[i];
              if (x === undefined || y === undefined) return x === y ? 0 : x === undefined ? -1 : 1;
              if (x === y) continue;
              const xNumeric = /^\d+$/.test(x), yNumeric = /^\d+$/.test(y);
              if (xNumeric && yNumeric) return BigInt(x) < BigInt(y) ? -1 : 1;
              if (xNumeric !== yNumeric) return xNumeric ? -1 : 1;
              return x < y ? -1 : 1;
            }
            return 0;
          }

          const minimum = parseVersion(manifest.dwcVersion);
          if (!minimum) {
            throw new Error(`${manifestPath} dwcVersion "${manifest.dwcVersion}" is not a numeric major.minor[.patch][-prerelease] version.`);
          }

          const releases = [];
          for (let page = 1; ; page++) {
            const response = await fetch(`https://api.github.com/repos/Duet3D/DuetWebControl/releases?per_page=100&page=${page}`, {
              headers: {
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
                ...(process.env.GITHUB_TOKEN ? { Authorization: `Bearer ${process.env.GITHUB_TOKEN}` } : {}),
              },
            });
            if (!response.ok) throw new Error(`GitHub Releases API returned ${response.status}: ${await response.text()}`);
            const batch = await response.json();
            if (!Array.isArray(batch)) throw new Error("GitHub Releases API returned an unexpected response.");
            releases.push(...batch);
            if (batch.length < 100) break;
          }

          const candidates = releases
            .map((release) => ({ release, version: parseVersion(release.tag_name.replace(/^v/, "")) }))
            .filter(({ version }) => version
              && version.major === minimum.major
              && version.minor === minimum.minor
              && (!minimum.patchSpecified || compareVersions(version, minimum) >= 0))
            .sort((a, b) => compareVersions(a.version, b.version));
          if (candidates.length === 0) {
            throw new Error(`No DuetWebControl release (including prereleases) found at or above ${manifest.dwcVersion} in the ${minimum.major}.${minimum.minor}.x series.`);
          }

          const requestedRef = process.env.DWC_REF_OVERRIDE.trim().replace(/^v/, "");
          const override = requestedRef
            ? candidates.find(({ release }) => release.tag_name.replace(/^v/, "") === requestedRef)
            : null;
          if (requestedRef && !override) {
            throw new Error(`Requested DWC release "${process.env.DWC_REF_OVERRIDE}" is not available or is below the compatible ${manifest.dwcVersion} minimum in the ${minimum.major}.${minimum.minor}.x series.`);
          }
          const selected = (override ?? candidates.at(-1)).release.tag_name;
          console.log(`Manifest: ${manifestPath} (plugin ${manifest.version}, minimum DWC ${manifest.dwcVersion})`);
          console.log(`Selected DuetWebControl release: ${selected}`);
          const releaseSummary = existingRelease
            ? `\n\n### Existing plugin release requires confirmation\n\nA published release already exists for tag \`${tag}\`: [${existingRelease.name || tag}](${existingRelease.html_url}). Approve the \`dwc-release-approval\` environment to continue and update that release's assets and notes, or reject the deployment to stop this run.`
            : tag
              ? `\n\nNo published release currently exists for \`${tag}\`. Approve the \`dwc-release-approval\` environment to continue, or reject the deployment to stop this run.`
              : "";
          appendFileSync(process.env.GITHUB_OUTPUT, `manifest=${manifestPath}\nplugin-version=${manifest.version}\ndwc-ref=${selected}\nrelease-exists=${existingRelease ? "true" : "false"}\nrelease-url=${existingRelease?.html_url ?? ""}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Release preflight\n\n- Plugin manifest: \`${manifestPath}\`\n- Plugin version: \`${manifest.version}\`\n- Minimum DWC version: \`${manifest.dwcVersion}\`\n- Selected DWC release: \`${selected}\`\n${releaseSummary}\n`);
          NODE

  build:
    needs: resolve-dwc
    runs-on: ubuntu-latest
    environment:
      # Configure this environment with required reviewers in repository Settings to pause before build.
      name: dwc-release-approval
      url: ${{ needs.resolve-dwc.outputs.release-url }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin
          fetch-depth: 0 # full history + tags so the changelog generator can find the previous tag
          fetch-tags: true

      - uses: actions/setup-node@v6
        with: { node-version: 24 }

      - name: Checkout DuetWebControl
        uses: actions/checkout@v6
        with:
          repository: Duet3D/DuetWebControl
          ref: ${{ needs.resolve-dwc.outputs.dwc-ref }}
          path: DuetWebControl

      # Record exactly which DWC the ZIP is built against, for the release notes.
      - name: Capture DuetWebControl build info
        id: dwc
        run: |
          echo "version=$(node -p "require('./DuetWebControl/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C DuetWebControl rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "ref=${{ needs.resolve-dwc.outputs.dwc-ref }}" >> "$GITHUB_OUTPUT"

      - name: Install DuetWebControl
        working-directory: DuetWebControl
        run: npm install

      - name: Install plugin (and its bundled deps into DWC)
        working-directory: plugin
        run: |
          npm install
          # Install the plugin's runtime dependencies into DWC with their exact specs (github: specs
          # used verbatim, registry specs as name@range) so the build/type-check can resolve them.
          SPECS=$(node -p "Object.entries(require('./package.json').dependencies||{}).map(([k,v])=>/[:\\/]/.test(v)?v:k+'@'+v).join(' ')")
          if [ -n "$SPECS" ]; then (cd ../DuetWebControl && npm install --no-save $SPECS); fi

      - name: Type-check against DWC
        working-directory: plugin
        env:
          DWC_DIR: ${{ github.workspace }}/DuetWebControl
        run: npm run typecheck

      - name: Build installable ZIP
        working-directory: plugin
        env:
          DWC_DIR: ${{ github.workspace }}/DuetWebControl
        run: npm run verify-build

      - name: Prepare standalone ZIP assets
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: plugin
        run: |
          if [ ! -d standalone-zip ]; then
            echo "No standalone-zip directory; skipping standalone ZIP assets."
            exit 0
          fi
          shopt -s nullglob
          archives=(standalone-zip/*.zip)
          if (( ${#archives[@]} == 0 )); then
            echo "No ZIP files in standalone-zip; skipping standalone ZIP assets."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/standalone-assets"
          for archive in "${archives[@]}"; do
            asset="standalone-$(basename "$archive")"
            cp -- "$archive" "$RUNNER_TEMP/standalone-assets/$asset"
            echo "Prepared standalone release asset: $asset"
          done

      # Release body = Conventional-Commit changelog (see CONTRIBUTING.md) + a footer with install
      # instructions, the DWC version built against, and the community-gallery call-to-action.
      # Fetch the shared changelog generator from the runtime repo (single source of truth, pinned ref).
      - name: Fetch shared release-notes generator
        if: startsWith(github.ref, 'refs/tags/')
        run: curl -fsSL "https://raw.githubusercontent.com/jaysuk/dwc-plugin-runtime/${RUNTIME_REF}/scripts/changelog.mjs" -o "$RUNNER_TEMP/changelog.mjs"

      - name: Generate release notes
        id: changelog
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: plugin
        env:
          DWC_VERSION: ${{ steps.dwc.outputs.version }}
          DWC_SHA: ${{ steps.dwc.outputs.sha }}
          DWC_REF: ${{ steps.dwc.outputs.ref }}
        run: |
          {
            echo 'body<<__CHANGELOG_EOF__'
            node "$RUNNER_TEMP/changelog.mjs"
            echo
            node scripts/release-footer.mjs
            echo
            echo '__CHANGELOG_EOF__'
          } >> "$GITHUB_OUTPUT"

      # Auto-pick the release title from scripts/release-titles.txt.
      - name: Resolve release title
        id: title
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: plugin
        run: |
          {
            echo 'name<<__TITLE_EOF__'
            node scripts/release-title.mjs
            echo
            echo '__TITLE_EOF__'
          } >> "$GITHUB_OUTPUT"
          LEFT=$(node scripts/release-title.mjs --remaining)
          if [ "$LEFT" -le 5 ]; then
            echo "::warning::Only $LEFT unused release title(s) left — add more to scripts/release-titles.txt"
          fi

      - name: Publish Release with the ZIP (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: false # auto-publish: title + notes are generated
          name: ${{ steps.title.outputs.name }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            plugin/duetPrintGuard-*.zip
            ${{ runner.temp }}/standalone-assets/standalone-*.zip
          fail_on_unmatched_files: false

      - name: Upload ZIP as an artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: duetPrintGuard-plugin
          path: plugin/duetPrintGuard-*.zip
